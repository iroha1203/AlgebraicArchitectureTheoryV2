name: Lean

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research-integrity-gates:
    name: research integrity gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Research package validation
        id: research-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/lean_quality/select_research_package_validation.sh

      - name: Current-tree import graph
        run: .github/lean_quality/check_research_import_direction.sh

      - name: Legacy reference no-new gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/lean_quality/check_research_legacy_refs.sh no-new "$BASE_SHA" "$HEAD_SHA"

      - name: Legacy reference no-new gate (main push)
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
          fi
          .github/lean_quality/check_research_legacy_refs.sh no-new "$BASE_SHA" "$HEAD_SHA"

      - name: Research separation fixture suite
        run: .github/lean_quality/test_research_separation_gates.sh

      - name: Research package direction (static)
        run: .github/lean_quality/test_research_package_direction.sh

      - name: Research validation selection test
        run: .github/lean_quality/test_research_package_validation.sh

      - name: Set up Lean for Research package validation
        if: steps.research-changes.outputs.run == 'true'
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Package dependency direction (runtime)
        if: steps.research-changes.outputs.run == 'true'
        run: .github/lean_quality/check_research_package_direction.sh --execute

      - name: Research migration fixture suite
        run: .github/lean_quality/test_research_migration_manifest.sh

      - name: Committed R3 migration artifact integrity
        run: |
          manifest_rows="$(awk -F '\t' '!/^#/ && NF { count++ } END { print count + 0 }' research/lean/migrations/R3/manifest.tsv)"
          test "$manifest_rows" -eq 39
          jq -e '.schema == "aat-research-migration/v1" and .batch == "R3" and .moduleCount == 39 and .declarationCount == 1549' \
            research/lean/migrations/R3/metadata.json >/dev/null
          declaration_rows="$(jq -s 'length' research/lean/migrations/R3/declarations.jsonl)"
          unique_records="$(jq -s 'map(.migration_record) | unique | length' research/lean/migrations/R3/declarations.jsonl)"
          test "$declaration_rows" -eq 1549
          test "$unique_records" -eq "$declaration_rows"
          legacy_namespace='Formal.AG.Resear''ch'
          legacy_path='Formal/AG/'"Research"
          ! rg -n "$legacy_namespace|$legacy_path|ResearchLean.AG" \
            research/lean/migrations/R3/declarations.jsonl

      - name: Changed public artifacts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/lean_quality/check_changed_public_artifacts.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Changed public artifacts (main push)
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
          fi
          .github/lean_quality/check_changed_public_artifacts.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Changed public artifact fixtures
        run: .github/lean_quality/test_changed_public_artifacts.sh

  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select active AAT algebraic geometry build
        id: ag-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/lean_quality/select_lean_validation.sh ag

      - name: Set up Lean
        if: steps.ag-changes.outputs.run == 'true'
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Restore Formal build cache
        if: steps.ag-changes.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: formal-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            formal-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build active AAT algebraic geometry
        if: steps.ag-changes.outputs.run == 'true'
        run: lake build +Formal.AG

      - name: Save Formal build cache
        if: always() && steps.ag-changes.outputs.run == 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: formal-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Kernel axiom audit
        if: steps.ag-changes.outputs.run == 'true'
        run: |
          lake build Formal.Util.AssertStandardAxioms
          lake env lean Formal/Util/AssertStandardAxiomsTest.lean
          lake env lean Formal/AG/AxiomAudit.lean
          test "$(grep -v '^[[:space:]]*$' Formal/AG/AxiomAudit.lean | tail -n 1)" = '#assert_standard_axioms_only AAT.AG.AxiomAudit'

      - name: Premise diff report
        if: steps.ag-changes.outputs.run == 'true'
        run: .github/lean_quality/list_premise_diff.sh

  shigure:
    name: SHIGURE build and kernel audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select SHIGURE validation
        id: shigure-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/lean_quality/select_lean_validation.sh shigure

      - name: Set up Lean for SHIGURE
        if: steps.shigure-changes.outputs.run == 'true'
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Check SHIGURE imports
        if: steps.shigure-changes.outputs.run == 'true'
        run: |
          imports_file="$RUNNER_TEMP/shigure-mathlib-imports"
          lean --run .github/lean_quality/check_shigure_imports.lean --mathlib-imports > "$imports_file"
          # The declaration checker fixtures also import NormNum directly.
          printf '%s\n' Mathlib.Tactic.NormNum >> "$imports_file"
          sort -u -o "$imports_file" "$imports_file"
          git ls-files -z -- ':(glob)Formal/SHIGURE/**/*.lean' Formal/SHIGURE.lean > "$RUNNER_TEMP/shigure-files"

      - name: Fetch SHIGURE Mathlib dependencies
        if: steps.shigure-changes.outputs.run == 'true'
        run: |
          # Lake can use the pinned Mathlib checkout without downloading its history.
          if [[ ! -e .lake/packages/mathlib ]]; then
            url="$(jq -er '.packages[] | select(.name == "mathlib" and .type == "git") | .url' lake-manifest.json)"
            revision="$(jq -er '.packages[] | select(.name == "mathlib" and .type == "git") | .rev' lake-manifest.json)"
            mathlib="$(mktemp -d "$RUNNER_TEMP/shigure-mathlib.XXXXXX")"
            git init -q "$mathlib"
            git -C "$mathlib" remote add origin "$url"
            git -C "$mathlib" fetch -q --no-tags --depth=1 origin "$revision"
            git -C "$mathlib" checkout -q --detach "$revision"
            mkdir -p .lake/packages
            mv "$mathlib" .lake/packages/mathlib
          fi
          mapfile -t imports < "$RUNNER_TEMP/shigure-mathlib-imports"
          lake exe cache get "${imports[@]}"

      - name: Restore SHIGURE build cache
        if: steps.shigure-changes.outputs.run == 'true'
        id: shigure-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/build
            .lake/shigure-audit/verified-manifest.tsv
          key: shigure-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', '.github/lean_quality/ShigureBuildAudit.lean', '.github/lean_quality/shigure_cache_manifest.py') }}-${{ github.sha }}
          restore-keys: |
            shigure-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', '.github/lean_quality/ShigureBuildAudit.lean', '.github/lean_quality/shigure_cache_manifest.py') }}-

      - name: Build SHIGURE
        if: steps.shigure-changes.outputs.run == 'true'
        run: |
          audit_dir="$RUNNER_TEMP/shigure-build-audit"
          plugin_dir=".lake/shigure-audit"
          export SHIGURE_AUDIT_STAMPS="$audit_dir/stamps"
          rm -rf "$SHIGURE_AUDIT_STAMPS"
          mkdir -p "$SHIGURE_AUDIT_STAMPS" "$plugin_dir"

          # Keep only cached build artifacts whose source, trace, and olean match the verified manifest.
          python3 .github/lean_quality/shigure_cache_manifest.py prune \
            --files "$RUNNER_TEMP/shigure-files" \
            --manifest "$plugin_dir/verified-manifest.tsv" \
            --build-root .lake/build/lib/lean

          cp .github/lean_quality/ShigureBuildAudit.lean "$audit_dir"
          (
            export ELAN_TOOLCHAIN="$(cat lean-toolchain)"
            cd "$audit_dir"
            lean -c ShigureBuildAudit.c ShigureBuildAudit.lean
            leanc -shared -fPIC -DLEAN_EXPORTING -o libShigureBuildAudit.so ShigureBuildAudit.c
          )
          cp "$audit_dir/libShigureBuildAudit.so" "$plugin_dir/libShigureBuildAudit.so"
          # Use a deterministic workspace-relative plugin path so Lake traces remain reusable across runners.
          plugin="$plugin_dir/libShigureBuildAudit.so"
          awk -v plugin="$plugin" '
            { print }
            $0 == "name = \"Formal\"" { print "moreLeanArgs = [\"--plugin=" plugin "\"]" }
          ' lakefile.toml > "$audit_dir/lakefile.toml"

          targets=(+Formal.SHIGURE)
          while IFS= read -r -d '' file; do
            case "$file" in
              Formal/SHIGURE.lean|Formal/SHIGURE/AxiomAudit.lean|Formal/SHIGURE/AssertStandardAxiomsTest.lean)
                continue ;;
            esac
            module="${file%.lean}"
            targets+=("+${module//\//.}")
          done < "$RUNNER_TEMP/shigure-files"
          lake -f "$audit_dir/lakefile.toml" build "${targets[@]}"

      - name: Check SHIGURE syntax and declaration dependencies
        if: steps.shigure-changes.outputs.run == 'true'
        run: |
          set -o pipefail
          checker_dir="$(mktemp -d "$RUNNER_TEMP/shigure-checker.XXXXXX")"
          lake env lean -o "$checker_dir/ShigureDeclarationCheck.olean" .github/lean_quality/check_shigure_declarations.lean
          printf 'import ShigureDeclarationCheck\n' > "$checker_dir/Run.lean"
          audit_dir="$RUNNER_TEMP/shigure-build-audit"
          plugin_dir=".lake/shigure-audit"
          python3 .github/lean_quality/shigure_cache_manifest.py verify \
            --files "$RUNNER_TEMP/shigure-files" \
            --manifest "$plugin_dir/verified-manifest.tsv" \
            --stamps "$audit_dir/stamps" \
            --build-root .lake/build/lib/lean \
            --new-manifest "$audit_dir/verified-manifest.tsv" \
            --source-checks-out "$audit_dir/source-checks.nul"

          separate_file="$audit_dir/separate-modules.nul"
          lake env bash -e -o pipefail -c '
            export LEAN_PATH="$1:$LEAN_PATH"
            export SHIGURE_CHECKER_SCRIPT="$1/Run.lean"
            xargs -0 -r lean --run "$1/Run.lean" --compiled --separate-out "$3" < "$2"
            if [[ -s "$3" ]]; then
              xargs -0 -r -n 1 -P 2 -t lean --run "$1/Run.lean" --compiled-isolated < "$3"
            fi
            if [[ -s "$4" ]]; then
              xargs -0 -r -n 1 -P 2 -t lean --run "$1/Run.lean" < "$4"
            fi
          ' bash "$checker_dir" "$RUNNER_TEMP/shigure-files" "$separate_file" "$audit_dir/source-checks.nul"
          SHIGURE_CHECKER_DIR="$checker_dir" SHIGURE_CHECKER_SCRIPT="$checker_dir/Run.lean" \
            bash .github/lean_quality/test_shigure_declarations.sh "$PWD/$plugin_dir/libShigureBuildAudit.so"
          mv "$audit_dir/verified-manifest.tsv" "$plugin_dir/verified-manifest.tsv"

      - name: Audit SHIGURE kernel dependencies
        if: steps.shigure-changes.outputs.run == 'true'
        run: |
          test "$(grep -v '^[[:space:]]*$' Formal/SHIGURE/AxiomAudit.lean | tail -n 1)" = '#shigure_assert_standard_axioms_only SHIGURE.AxiomAudit'
          lake env lean Formal/SHIGURE/AssertStandardAxiomsTest.lean
          lake env lean Formal/SHIGURE/AxiomAudit.lean

      - name: Save SHIGURE build cache
        if: >
          steps.shigure-changes.outputs.run == 'true' &&
          steps.shigure-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/build
            .lake/shigure-audit/verified-manifest.tsv
          key: ${{ steps.shigure-cache.outputs.cache-primary-key }}

[package]
name = "archsig"
version = "0.6.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
nix = { version = "0.29", default-features = false, features = ["resource", "signal", "process"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rustix = { version = "1", features = ["fs"] }
sha2 = "0.10"
signal-hook = "0.3"
stacker = "0.1"

[[test]]
name = "integration"
path = "tests/integration.rs"

[profile.test]
debug = false

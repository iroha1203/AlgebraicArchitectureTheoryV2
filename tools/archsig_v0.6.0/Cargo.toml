[package]
name = "archsig"
version = "0.6.0"
edition = "2024"
publish = false
autotests = false

[workspace]
members = ["crates/common", "crates/input", "crates/computation"]
default-members = [".", "crates/common", "crates/input", "crates/computation"]
resolver = "3"

[dependencies]
archsig-computation = { path = "crates/computation" }
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
rustix = { version = "1", features = ["fs"] }
signal-hook = "0.3"
stacker = "0.1"

[dev-dependencies]
archsig-computation = { path = "crates/computation", features = ["test-support"] }
num-bigint = "0.4"

[[test]]
name = "integration"
path = "tests/integration.rs"

[profile.test]
debug = false

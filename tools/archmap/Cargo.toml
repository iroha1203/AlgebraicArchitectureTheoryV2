[package]
name = "archmap"
version = "0.5.4"
edition = "2024"
license = "MIT"

[dependencies]
archsig = { path = "../archsig" }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
